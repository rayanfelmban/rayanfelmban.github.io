<!DOCTYPE html>
<!-- السطر فوق يقول للمتصفح: هذا ملف HTML حديث -->

<html lang="ar" dir="rtl">
<!-- html = الوعاء الذي يحتوي الصفحة كلها
     lang="ar" = لغة الصفحة عربية
     dir="rtl" = اتجاه الكتابة من اليمين لليسار -->

<head>
    <!-- head = معلومات "عن" الصفحة، لا تظهر للزائر -->
    <meta charset="UTF-8">
    <title>صفحتي الأولى</title>
    <!-- title = الاسم الذي يظهر في تبويب المتصفح -->
</head>

<body>
    <!-- body = كل ما يراه الزائر فعلياً -->

    <h1>مرحباً بالعالم! أنا ريان</h1>
    <!-- h1 = أكبر عنوان في الصفحة -->

    <p>هذه أول صفحة ويب أكتبها بيدي.</p>
    <!-- p = فقرة نصية -->

    <p>اليوم تعلمت أن صفحة الويب هي مجرد ملف نصي يفهمه المتصفح.</p>

</body>
</html>
